name: Compile Release
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build CrossPoint
        run: pio run -e gh_release

      - name: Prepare release files
        run: |
          mkdir -p release
          cp .pio/build/gh_release/bootloader.bin "release/CrossPoint-${{ github.ref_name }}-bootloader.bin"
          cp .pio/build/gh_release/firmware.bin "release/CrossPoint-${{ github.ref_name }}-firmware.bin"
          cp .pio/build/gh_release/firmware.elf "release/CrossPoint-${{ github.ref_name }}-firmware.elf"
          cp .pio/build/gh_release/firmware.map "release/CrossPoint-${{ github.ref_name }}-firmware.map"
          cp .pio/build/gh_release/partitions.bin "release/CrossPoint-${{ github.ref_name }}-partitions.bin"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-${{ github.ref_name }}
          path: |
            release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CrossPoint ${{ github.ref_name }}
          body: Korean AI build based on CrossPoint ${{ github.ref_name }}.
          files: release/*
