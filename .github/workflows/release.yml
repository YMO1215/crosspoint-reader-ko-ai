name: Compile Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip esptool

      - name: Set version from tag
        run: sed -i "s/^version = .*/version = ${{ github.ref_name }}/" platformio.ini

      - name: Build CrossPoint
        run: pio run -e gh_release

      - name: Merge firmware binaries
        run: |
          esptool.py --chip esp32c3 merge_bin \
            -o .pio/build/gh_release/CrossPoint-${{ github.ref_name }}.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0 .pio/build/gh_release/bootloader.bin \
            0x8000 .pio/build/gh_release/partitions.bin \
            0x10000 .pio/build/gh_release/firmware.bin

      - name: Prepare release files
        run: |
          mkdir -p release
          cp .pio/build/gh_release/CrossPoint-${{ github.ref_name }}.bin release/
          cp .pio/build/gh_release/bootloader.bin release/CrossPoint-${{ github.ref_name }}-bootloader.bin
          cp .pio/build/gh_release/firmware.bin release/CrossPoint-${{ github.ref_name }}-firmware.bin
          cp .pio/build/gh_release/firmware.elf release/CrossPoint-${{ github.ref_name }}-firmware.elf
          cp .pio/build/gh_release/firmware.map release/CrossPoint-${{ github.ref_name }}-firmware.map
          cp .pio/build/gh_release/partitions.bin release/CrossPoint-${{ github.ref_name }}-partitions.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-${{ github.ref_name }}
          path: release/*

      - name: Resolve release notes
        id: notes
        run: |
          NOTES="docs/release-notes/${{ github.ref_name }}.md"
          if [[ -f "$NOTES" ]]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release notes at $NOTES; falling back to auto-generated notes."
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CrossPoint Korean AI ${{ github.ref_name }}
          files: release/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          draft: false
          prerelease: false
